name: Build and publish validated R2
on:
  push:
    branches: ['release/snes-r2-validated']
    paths: ['.github/workflows/release-r2-validated.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: sinfonia-r2-validated
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify that the source and original inputs are committed
        run: |
          test -f src/movement.s
          test -f assets/data.json
          test -f tools/original_scores.json
          python3 -m pip install -r requirements-assets.txt numpy
      - name: Download and verify build tools and emulator
        run: |
          gh run download 35096305893 --repo "$GITHUB_REPOSITORY" --name native-snes-build-tools --dir "$RUNNER_TEMP/snes-tools"
          cd "$RUNNER_TEMP/snes-tools"
          sha256sum -c SHA256SUMS
          chmod +x bin/ca65 bin/ld65
          echo "$RUNNER_TEMP/snes-tools/bin" >> "$GITHUB_PATH"
          echo "SNES_CORE=$RUNNER_TEMP/snes-tools/snes9x_libretro.so" >> "$GITHUB_ENV"
      - name: Rebuild the identical ROM and verify its native layout
        run: |
          python3 tools/build_content.py
          python3 tools/generate_graphics.py
          python3 tools/build_audio.py
          python3 tools/build.py
          echo '57d02a02c1346b2380707635c6c88be04cd50c781d34259d9f39e6c8be11d38f  build/sinfonia-castlevanica.sfc' | sha256sum -c -
          python3 tests/validate_graphics.py
          python3 tests/validate_rom.py
          (cd dist && sha256sum *.smc *.sfc > SHA256SUMS)
      - name: Verify movement, SRAM and the complete campaign in the emulator
        run: |
          python3 tests/test_movement_revision.py
          python3 tests/adaptive_revision.py
          python3 tests/replay_revision.py
      - name: Commit the checksum manifest and fresh test evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/SHA256SUMS build/qa-revision
          if ! git diff --cached --quiet; then
            git commit -m 'Record final R2 checksums and repeated controller validation'
            git push origin HEAD:release/snes-r2-validated
          fi
      - name: Package source without tools, credentials or external fonts
        run: |
          python3 - <<'PY'
          import zipfile,os,hashlib
          from pathlib import Path
          folders=['src','tools','tests','assets','docs','dist','build/qa-revision']
          names=['README.md','Makefile','lorom.cfg','requirements-assets.txt','build/labels.json','build/labels.txt','build/rom-info.json','build/rom.map']
          files=[Path(n) for n in names]
          for folder in folders: files.extend(p for p in Path(folder).rglob('*') if p.is_file())
          out=Path(os.environ['RUNNER_TEMP'])/'sinfonia-snes-r2-codigo.zip'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,9) as z:
              for p in sorted(set(files)):
                  if '__pycache__' not in p.parts and p.suffix not in ['.pyc','.srm','.ttf','.otf','.woff','.woff2']: z.write(p,str(p))
          print('Source ZIP SHA256:',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Publish public ROM and source downloads
        run: |
          gh release create r2-validated-20260916 --repo "$GITHUB_REPOSITORY" --target release/snes-r2-validated --title 'Revisao R2: movimento, animacao e portas' --notes-file docs/REVISAO-2.md dist/sinfonia-castlevanica-snes-r2.smc dist/sinfonia-castlevanica-snes-r2.sfc dist/SHA256SUMS "$RUNNER_TEMP/sinfonia-snes-r2-codigo.zip"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sinfonia-r2-validated
          path: |
            ${{ runner.temp }}/sinfonia-snes-r2-codigo.zip
            dist/sinfonia-castlevanica-snes-r2.smc
            dist/SHA256SUMS
            build/qa-revision/result.json
            build/qa-revision/replay-result.json
            build/qa-revision/movement-result.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: r2-diagnostic
          path: |
            dist
            build/rom-info.json
            build/qa-revision
          retention-days: 7
