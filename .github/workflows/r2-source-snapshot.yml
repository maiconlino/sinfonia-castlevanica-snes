name: Snapshot source for validated R2
on:
  push:
    branches: ['release/snes-r2-validated']
    paths: ['.github/workflows/r2-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f94378dd2ab2bc6727b819d888890c0e15569bf1
      - name: Preserve current imports without modifying them
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          parts=sorted(Path('.source-import').glob('part-*.b64'))
          assert len(parts)==6, len(parts)
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert len(raw)==63344, len(raw)
          Path('source-snapshot.tar.xz').write_bytes(raw)
          Path('source-snapshot.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  source-snapshot.tar.xz\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r2-source-snapshot
          path: |
            source-snapshot.tar.xz
            source-snapshot.sha256
          retention-days: 7
