name: Recover interrupted source snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-snapshot.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked files without credentials
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source-snapshot
          path: source-snapshot.zip
          retention-days: 7
